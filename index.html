<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบสต๊อกสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#1b2130; --muted:#667085; --line:#e2e5ea;
  --pri:#1d4f91; --pri-ink:#fff; --pri-soft:#e8eef8; --acc:#f2b33d;
  --ok:#157f3c; --ok-soft:#e6f4ea; --bad:#b42318; --bad-soft:#fdecea; --warn:#a15c07; --warn-soft:#fdf3e2;
  --side:#14203a; --r:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1{font-size:22px;margin:0}
h3{font-size:16px;margin:0 0 12px}
a{color:var(--pri)}
.hidden{display:none!important}
.sub{font-size:12.5px;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grow{flex:1 1 220px}
.hint{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:8px;margin:10px 0 0}
input,select,textarea{font:inherit;color:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
select:disabled{background:#f6f7f9;color:var(--ink)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f7f9}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:#f3c7c2}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px}
.x:hover{color:var(--bad)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f > input,label.f > select,label.f > textarea{color:var(--ink);font-size:15px}
label.chk{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row.end{justify-content:flex-end;align-items:center;margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph .row{align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.alert .v{color:var(--bad)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--muted);font-size:13px;text-align:left;border-bottom:1px solid var(--line);padding:8px;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:#f8fafc}
tr.flash td{animation:flash 1s}
@keyframes flash{from{background:#fff4d6}to{background:transparent}}
td.empty{text-align:center;color:var(--muted);padding:28px}
td input.qty{width:100px;text-align:right}
.low{color:var(--bad);font-weight:600}
.okc{color:var(--ok);font-weight:600}
.b{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-IN{background:var(--ok-soft);color:var(--ok)} .b-OUT{background:var(--bad-soft);color:var(--bad)}
.b-TRANSFER{background:var(--pri-soft);color:var(--pri)} .b-ADJUST{background:var(--warn-soft);color:var(--warn)}
.b-COUNT{background:#f1eafd;color:#6b21a8} .b-x{background:#eceef1;color:var(--muted)}
.b-admin{background:#14203a;color:#fff} .b-manager{background:var(--pri-soft);color:var(--pri)} .b-staff{background:#eceef1;color:#475467}
.seg{display:inline-flex;background:#e7e9ee;border-radius:10px;padding:3px;margin-bottom:14px;flex-wrap:wrap}
.seg button{font:inherit;border:0;background:none;padding:7px 16px;border-radius:8px;cursor:pointer;color:#475467}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pick{position:relative}
.pick input{width:100%}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(16,24,40,.12);z-index:30;max-height:320px;overflow:auto}
.sug-i{padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f2f4}
.sug-i:hover{background:var(--pri-soft)}
.sug-e{padding:10px 12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 12px;background:#fff;font-size:14px}
.uc{display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;font-size:13px;color:var(--muted)}
.uc input{width:76px;text-align:right;padding:5px 8px}
/* screens */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth{width:min(400px,100%)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#14203a;font-weight:700}
.auth .brand{margin-bottom:18px}
.auth label.f{margin-bottom:12px}
.auth .btn{width:100%}
/* app layout */
#s-app{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--side);color:#c9d1e0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{color:#fff;padding:18px 16px 14px}
#nav{flex:1;overflow:auto;padding:6px 0}
#nav a{display:block;padding:10px 18px;color:#c9d1e0;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
#nav a:hover{background:rgba(255,255,255,.05);color:#fff}
#nav a.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--acc);font-weight:600}
.side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.side .me b{color:#fff;display:block;font-weight:600}
.side .me button{margin-top:8px;background:transparent;color:#c9d1e0;border-color:rgba(255,255,255,.2)}
.main{flex:1;min-width:0}
.topbar{display:none;align-items:center;gap:10px;background:var(--side);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
.topbar button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
#page{padding:22px 26px;max-width:1280px}
#side-dim{display:none}
@media (max-width:900px){
  .side{position:fixed;left:-250px;z-index:60;transition:left .2s}
  .side.open{left:0}
  #side-dim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .topbar{display:flex}
  #page{padding:14px}
  .cols2{grid-template-columns:1fr}
}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;overflow:auto;padding:32px 12px}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);padding:20px;position:relative}
.modal.wide{width:min(1000px,100%)}
.modal .mx{position:absolute;right:12px;top:10px}
.modal h2{font-size:19px;margin:0 32px 14px 0}
#scan-bg{z-index:120}
#scan-reader{width:100%;min-height:240px;background:#000;border-radius:8px;overflow:hidden;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#1b2130;color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
.t.bad{background:var(--bad)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:150;display:grid;place-items:center;font-weight:600;color:var(--pri)}
.dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:14px;margin-bottom:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0}
@media print{.side,.topbar{display:none}}
</style>
</head>
<body>

<!-- ตั้งค่าการเชื่อมต่อ -->
<div id="s-setup" class="center hidden">
  <div class="card auth">
    <div class="brand"><div class="logo">S</div>ตั้งค่าการเชื่อมต่อ</div>
    <label class="f">Supabase Project URL <input id="cfg-url" placeholder="https://xxxx.supabase.co"></label>
    <label class="f">Anon / Publishable key <input id="cfg-key" placeholder="eyJ... หรือ sb_publishable_..."></label>
    <button class="btn pri" onclick="saveCfg()">บันทึกและเชื่อมต่อ</button>
    <p class="sub">ค่าจะเก็บไว้ในเบราว์เซอร์นี้ หรือแก้ค่า SUPABASE_URL / SUPABASE_KEY ในไฟล์เพื่อใช้กับทุกเครื่อง</p>
  </div>
</div>

<!-- เข้าสู่ระบบ -->
<div id="s-login" class="center hidden">
  <div class="card auth">
    <div class="brand"><div class="logo">S</div>ระบบสต๊อกสินค้า</div>
    <div class="seg"><button id="tab-in" class="on" onclick="authTab(0)">เข้าสู่ระบบ</button><button id="tab-up" onclick="authTab(1)">สมัครใช้งาน</button></div>
    <label class="f hidden" id="f-name">ชื่อ-นามสกุล <input id="a-name"></label>
    <label class="f">อีเมล <input id="a-email" type="email" autocomplete="username"></label>
    <label class="f">รหัสผ่าน <input id="a-pass" type="password" autocomplete="current-password"></label>
    <button class="btn pri" id="a-btn" onclick="doAuth()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- รออนุมัติ -->
<div id="s-pending" class="center hidden">
  <div class="card auth">
    <div class="brand"><div class="logo">S</div>รอการอนุมัติ</div>
    <p id="pend-msg"></p>
    <div class="row"><button class="btn pri" onclick="afterLogin()">ตรวจสอบอีกครั้ง</button><button class="btn" onclick="logout()">ออกจากระบบ</button></div>
  </div>
</div>

<!-- แอพหลัก -->
<div id="s-app" class="hidden">
  <aside class="side" id="side">
    <div class="brand"><div class="logo">S</div>ระบบสต๊อก</div>
    <nav id="nav"></nav>
    <div class="me" id="me-box"></div>
  </aside>
  <div id="side-dim" onclick="toggleSide(false)"></div>
  <div class="main">
    <header class="topbar"><button onclick="toggleSide(true)" aria-label="เมนู">☰</button><b>ระบบสต๊อก</b></header>
    <main id="page"></main>
  </div>
</div>

<div id="modal-bg" class="modal-bg"><div id="modal" class="modal"></div></div>
<div id="scan-bg" class="modal-bg"><div class="modal" style="width:min(480px,100%)">
  <h2>สแกนบาร์โค้ด</h2><div id="scan-reader"></div>
  <button class="btn" style="width:100%" onclick="stopScanner()">ปิดกล้อง</button>
</div></div>
<div id="toast"></div>
<div id="loading" class="hidden">กำลังทำงาน...</div>

<script>
// ============================================================
//  ตั้งค่า: ใส่ค่าของโปรเจค Supabase ที่นี่ (หรือกรอกผ่านหน้าจอครั้งแรก)
// ============================================================
var SUPABASE_URL = 'https://qmkosjhjkhlurwmxngnp.supabase.co';
var SUPABASE_KEY = 'sb_publishable_Am3hrXB2a1MhMxe0XhR3Tw_XGeYNAlF';

var PAGE_SIZE = 50;
var TYPE = {IN:'รับเข้า', OUT:'จ่ายออก', TRANSFER:'โอนย้าย', ADJUST:'ปรับยอด', COUNT:'ตรวจนับ'};
var ROLE = {admin:'ผู้ดูแลระบบ', manager:'ผู้จัดการสาขา', staff:'พนักงาน'};
var sb = null, me = null;
var S = {branches:[], units:[], cats:[], unitMap:{}, branchMap:{}, catMap:{}, cur:null};
var PU = {};        // หน่วยของสินค้า: product_id -> [{unit_id,factor,barcode,name}] (เรียงจากใหญ่ไปเล็ก)
var PAGES = {};
var curPage = null;   // หน้าที่เปิดอยู่ (กันหน้าเก่าที่โหลดช้ามาวาดทับหน้าใหม่)

// ---------- ตัวช่วยทั่วไป ----------
function $(id){ return document.getElementById(id); }
// ใช้กับส่วนที่โหลดข้อมูลแบบรอผล: ถ้าผู้ใช้เปลี่ยนหน้าไปก่อนโหลดเสร็จ จะไม่เกิด error
function $h(id){ return document.getElementById(id) || {}; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n, d){ return Number(n || 0).toLocaleString('th-TH', {maximumFractionDigits: d == null ? 3 : d}); }
function money(n){ return Number(n || 0).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function today(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function daysAgo(n){ var d = new Date(); d.setDate(d.getDate() - n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function monthStart(){ return today().slice(0,8) + '01'; }
function thDate(s){ if(!s) return ''; var p = String(s).slice(0,10).split('-'); return p[2] + '/' + p[1] + '/' + (Number(p[0]) + 543); }
function thDateTime(s){ if(!s) return ''; var d = new Date(s); return d.toLocaleString('th-TH', {dateStyle:'short', timeStyle:'short'}); }
var ls = {
  get: function(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del: function(k){ try { localStorage.removeItem(k); } catch(e){} }
};
function toast(msg, type){
  var el = document.createElement('div'); el.className = 't' + (type === 'bad' ? ' bad' : ''); el.textContent = msg;
  $('toast').appendChild(el); setTimeout(function(){ el.remove(); }, type === 'bad' ? 5000 : 2800);
}
function errMsg(e){
  var m = (e && (e.message || e.error_description)) || String(e);
  if (/duplicate key/i.test(m)) {
    if (/barcode/.test(m)) return 'บาร์โค้ดนี้ถูกใช้กับสินค้าอื่นแล้ว';
    if (/sku/.test(m)) return 'รหัสสินค้านี้มีอยู่แล้ว';
    if (/code/.test(m)) return 'รหัสสาขานี้มีอยู่แล้ว';
    return 'ข้อมูลซ้ำกับที่มีอยู่แล้ว';
  }
  if (/foreign key/i.test(m)) return 'ลบไม่ได้ เพราะมีข้อมูลอื่นใช้งานอยู่';
  if (/row-level security|permission denied/i.test(m)) return 'ไม่มีสิทธิ์ทำรายการนี้';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต';
  if (/Invalid login credentials/i.test(m)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if (/Email not confirmed/i.test(m)) return 'ยังไม่ได้ยืนยันอีเมล กรุณาตรวจสอบกล่องจดหมาย';
  return m;
}
async function q(p){ var r = await p; if (r.error) throw r.error; return r.data; }
async function qc(p){ var r = await p; if (r.error) throw r.error; return {data: r.data || [], count: r.count || 0}; }
async function fetchAll(build){
  var out = [], from = 0, step = 1000;
  while (true) {
    var rows = await q(build().range(from, from + step - 1));
    out = out.concat(rows || []);
    if (!rows || rows.length < step) break;
    from += step;
  }
  return out;
}
async function busy(fn){
  $('loading').classList.remove('hidden');
  try { return await fn(); }
  catch(e){ console.error(e); toast(errMsg(e), 'bad'); }
  finally { $('loading').classList.add('hidden'); }
}
function beep(ok){
  try {
    var ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = ok ? 1200 : 300; g.gain.value = 0.08;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + (ok ? 0.08 : 0.3));
  } catch(e){}
}
function exportXlsx(rows, sheet, file){
  if (!window.XLSX) return toast('โหลดไลบรารี Excel ไม่สำเร็จ', 'bad');
  if (!rows.length) return toast('ไม่มีข้อมูลให้ส่งออก', 'bad');
  var ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheet); XLSX.writeFile(wb, file);
}
function cleanTerm(t){ return String(t || '').replace(/[%,()*\\]/g, ' ').trim(); }

// ---------- บาร์โค้ด (รองรับเครื่องสแกนตอนแป้นพิมพ์เป็นภาษาไทย) ----------
var KEDMANEE = {'ๅ':'1','/':'2','-':'3','ภ':'4','ถ':'5','ุ':'6','ึ':'7','ค':'8','ต':'9','จ':'0'};
function normBarcode(s){
  s = String(s || '').trim();
  s = s.replace(/[๐-๙]/g, function(c){ return String(c.charCodeAt(0) - 0x0E50); });
  if (/[฀-๿]/.test(s)) s = s.split('').map(function(c){ return KEDMANEE[c] || c; }).join('');
  return s;
}
var qr = null, qrDone = false;
function openScanner(cb){
  if (!window.Html5Qrcode) return toast('โหลดตัวสแกนกล้องไม่สำเร็จ', 'bad');
  $('scan-bg').style.display = 'flex'; qrDone = false;
  qr = new Html5Qrcode('scan-reader');
  qr.start({facingMode:'environment'}, {fps:10, qrbox:{width:260, height:160}}, function(txt){
    if (qrDone) return; qrDone = true; stopScanner(); beep(true); cb(txt);
  }, function(){}).catch(function(e){ toast('เปิดกล้องไม่ได้: ' + (e && e.message || e), 'bad'); stopScanner(); });
}
function stopScanner(){
  $('scan-bg').style.display = 'none';
  if (qr) { var x = qr; qr = null; x.stop().then(function(){ x.clear(); }).catch(function(){}); }
}

// ---------- modal ----------
function openModal(html, wide){
  var m = $('modal'); m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = '<button class="x mx" onclick="closeModal()" aria-label="ปิด">×</button>' + html;
  $('modal-bg').style.display = 'flex'; $('modal-bg').scrollTop = 0;
}
function closeModal(){ $('modal-bg').style.display = 'none'; $('modal').innerHTML = ''; }

// ---------- สิทธิ์ / สาขา ----------
function isAdmin(){ return me && me.role === 'admin'; }
function isMgr(){ return me && (me.role === 'admin' || me.role === 'manager'); }
function bname(id){ return S.branchMap[id] ? S.branchMap[id].name : '-'; }
function uname(id){ return S.unitMap[id] ? S.unitMap[id].name : '?'; }
function myBranches(){ return isAdmin() ? S.branches.filter(function(b){ return b.active; }) : S.branches.filter(function(b){ return b.id === me.branch_id; }); }
function branchSel(id, o){
  o = o || {};
  var list = myBranches(), v = o.value !== undefined ? o.value : S.cur;
  var all = o.all && isAdmin();

}

async function loadUnits(ids){
  var need = []; ids.forEach(function(id){ if (!PU[id] && need.indexOf(id) < 0) need.push(id); });
  for (var i = 0; i < need.length; i += 150) {
    var chunk = need.slice(i, i + 150);
    var rows = await q(sb.from('product_units').select('product_id,unit_id,factor,barcode').in('product_id', chunk));
    chunk.forEach(function(id){ PU[id] = []; });
    rows.forEach(function(r){ PU[r.product_id].push({unit_id:r.unit_id, factor:Number(r.factor), barcode:r.barcode, name:uname(r.unit_id)}); });
    chunk.forEach(function(id){ PU[id].sort(function(a, b){ return b.factor - a.factor; }); });
  }
}
function factorOf(pid, uid){ var u = (PU[pid] || []).find(function(x){ return x.unit_id == uid; }); return u ? u.factor : 1; }
function breakdown(pid, base){
  var u = PU[pid]; base = Number(base || 0);
  if (!u || u.length < 2 || !base) return '';
  var rest = Math.abs(base), parts = [];
  u.forEach(function(x){
    var n = Math.floor(rest / x.factor + 1e-9);
    if (n > 0) { parts.push(num(n, 0) + ' ' + x.name); rest = +(rest - n * x.factor).toFixed(3); }
  });
  if (rest > 0) parts.push(num(rest) + ' ' + u[u.length - 1].name);
  if (parts.length < 2 && u[u.length - 1].factor === 1 && Math.abs(base) < u[0].factor) return '';
  return (base < 0 ? '-' : '') + parts.join(' ');
}
function qtyHtml(pid, base, unitId, cls){
  var b = breakdown(pid, base);
  return '<span class="' + (cls || '') + '"><b>' + num(base) + '</b> ' + esc(uname(unitId)) + '</span>' + (b ? '<div class="sub">= ' + esc(b) + '</div>' : '');
}

var PCOLS = 'id,sku,name,base_unit_id,cost,category_id,active';
async function prodSearch(term){
  var t = cleanTerm(term);
  var qb = sb.from('products').select(PCOLS).eq('active', true).order('sku').limit(15);
  if (t) qb = qb.or('sku.ilike.%' + t + '%,name.ilike.%' + t + '%');
  return q(qb);
}
async function findByCode(raw){
  var code = normBarcode(raw); if (!code) return null;
  var u = await q(sb.from('product_units').select('unit_id, products(' + PCOLS + ')').eq('barcode', code).maybeSingle());
  if (u && u.products && u.products.active) return {p: u.products, unit_id: u.unit_id};
  var p = await q(sb.from('products').select(PCOLS).eq('sku', code).eq('active', true).limit(1));
  return p[0] ? {p: p[0], unit_id: p[0].base_unit_id} : null;
}
// ช่องสแกน/ค้นหา: Enter = หาด้วยบาร์โค้ดหรือรหัส, พิมพ์ = แสดงรายการแนะนำ
function attachPicker(inputId, onPick){
  var inp = $(inputId), box = document.createElement('div'), timer = null, items = [];
  box.className = 'sug hidden'; inp.parentNode.appendChild(box);
  function hide(){ box.classList.add('hidden'); }
  inp.addEventListener('input', function(){
    clearTimeout(timer); var v = inp.value.trim();
    if (v.length < 2) return hide();
    timer = setTimeout(async function(){
      try {
        items = await prodSearch(v);
        if (inp.value.trim() !== v) return;
        box.innerHTML = items.length ? items.map(function(p, i){ return '<div class="sug-i" data-i="' + i + '"><b>' + esc(p.sku) + '</b> &nbsp;' + esc(p.name) + '</div>'; }).join('') : '<div class="sug-e">ไม่พบสินค้า</div>';
        box.classList.remove('hidden');
      } catch(e){}
    }, 300);
  });
  box.addEventListener('mousedown', function(e){
    var el = e.target.closest('.sug-i'); if (!el) return; e.preventDefault();
    var p = items[Number(el.dataset.i)]; inp.value = ''; hide(); onPick(p, null);
  });
  inp.addEventListener('blur', function(){ setTimeout(hide, 150); });
  inp.addEventListener('keydown', async function(e){
    if (e.key !== 'Enter') return;
    e.preventDefault(); clearTimeout(timer);
    var v = inp.value.trim(); if (!v) return;
    inp.value = ''; hide();
    try {
      var r = await findByCode(v);
      if (r) return onPick(r.p, r.unit_id);
      var s = await prodSearch(v);
      if (s.length === 1) return onPick(s[0], null);
      beep(false); toast(s.length ? 'พบหลายรายการ กรุณาเลือกจากรายการแนะนำ' : 'ไม่พบสินค้า: ' + v, 'bad');
      if (s.length) { inp.value = v; inp.dispatchEvent(new Event('input')); }
    } catch(err){ toast(errMsg(err), 'bad'); }
  });
}

function normUrl(u){
  u = String(u || '').trim();
  var m = u.match(/supabase\.com\/dashboard\/project\/([a-z0-9]+)/i);
  if (m) return 'https://' + m[1] + '.supabase.co';
  m = u.match(/^(https?:\/\/[^\/?#\s]+)/i);
  return m ? m[1] : u;
}

// ============================================================
//  พิมพ์บาร์โค้ด (สติกเกอร์ติดชั้นวาง / แผ่นรวมสำหรับสแกน)
// ============================================================
// บาร์โค้ดของร้าน: EAN-13 ขึ้นต้นด้วย 2 (ช่วงเลขสำหรับใช้ภายในร้าน) = 2 + รหัสหน่วย 3 หลัก + รหัสสินค้า 8 หลัก + เลขตรวจสอบ
function ean13Check(d12){ var s = 0; for (var i = 0; i < 12; i++) s += Number(d12[i]) * (i % 2 ? 3 : 1); return String((10 - s % 10) % 10); }
function shopCode(pid, uid){ var d = '2' + String(uid).padStart(3, '0').slice(-3) + String(pid).padStart(8, '0').slice(-8); return d + ean13Check(d); }
function barcodeSvg(code, h){
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  var fmt = /^\d{13}$/.test(code) && ean13Check(code.slice(0, 12)) === code[12] ? 'EAN13' : 'CODE128';
  var opt = {format: fmt, height: h || 50, width: 2, margin: 4, fontSize: 16, displayValue: true};
  try { JsBarcode(svg, code, opt); } catch(e){ opt.format = 'CODE128'; JsBarcode(svg, code, opt); }
  var w = parseFloat(svg.getAttribute('width')), hh = parseFloat(svg.getAttribute('height'));
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hh); svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.removeAttribute('style'); svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  return svg.outerHTML;
}

async function importProducts(file){
  if (!file || !window.XLSX) return;
  var H = {sku:['รหัส','รหัสสินค้า','sku'], name:['ชื่อสินค้า','ชื่อ','name'], cat:['หมวดหมู่','หมวด'], unit:['หน่วยฐาน','หน่วย'], barcode:['บาร์โค้ด'],
    cost:['ต้นทุน'], price:['ราคาขาย','ราคา'], min:['จุดสั่งซื้อ'], unit2:['หน่วยใหญ่'], factor2:['จำนวนต่อหน่วยใหญ่'], barcode2:['บาร์โค้ดหน่วยใหญ่']};
  function get(r, k){ for (var j = 0; j < H[k].length; j++) { var v = r[H[k][j]]; if (v !== undefined && String(v).trim() !== '') return String(v).trim(); } return ''; }
  function n(v){ var x = Number(String(v).replace(/,/g, '')); return isFinite(x) ? x : 0; }
  await busy(async function(){
    var wb = XLSX.read(await file.arrayBuffer());
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:'', raw:false}).filter(function(r){ return get(r, 'sku') && get(r, 'name'); });
    if (!rows.length) throw new Error('ไม่พบข้อมูล ต้องมีคอลัมน์ "รหัส" และ "ชื่อสินค้า"');
    if (!confirm('นำเข้า/อัปเดตสินค้า ' + rows.length + ' รายการ ?')) return;
    // สร้างหน่วยและหมวดที่ยังไม่มี
    var unitNames = {}, catNames = {};
    rows.forEach(function(r){ [get(r, 'unit'), get(r, 'unit2')].forEach(function(u){ if (u) unitNames[u] = 1; }); if (get(r, 'cat')) catNames[get(r, 'cat')] = 1; });
    var newU = Object.keys(unitNames).filter(function(u){ return !S.units.some(function(x){ return x.name === u; }); });
    var newC = Object.keys(catNames).filter(function(c){ return !S.cats.some(function(x){ return x.name === c; }); });
    if (newU.length) await q(sb.from('units').insert(newU.map(function(x){ return {name:x}; })));
    if (newC.length) await q(sb.from('categories').insert(newC.map(function(x){ return {name:x}; })));
    await loadMaster();
    function uid(name){ var u = S.units.find(function(x){ return x.name === name; }); return u ? u.id : null; }
    function cid(name){ var c = S.cats.find(function(x){ return x.name === name; }); return c ? c.id : null; }
    var existing = await fetchAll(function(){ return sb.from('products').select('id,sku,base_unit_id,note,active').order('id'); });
    var bySku = {}; existing.forEach(function(p){ bySku[p.sku] = p; });
    var ok = 0, errs = [];
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], sku = get(r, 'sku'), old = bySku[sku];
      $('loading').textContent = 'กำลังนำเข้า ' + (i + 1) + ' / ' + rows.length;
      try {
        var base = uid(get(r, 'unit')) || (old ? old.base_unit_id : S.units[0].id);
        var units = [];
        if (old) { delete PU[old.id]; await loadUnits([old.id]); units = PU[old.id].map(function(u){ return {unit_id:u.unit_id, factor:u.factor, barcode:u.barcode || ''}; }); }
        var put = function(unitId, factor, barcode){
          var ex = units.find(function(u){ return u.unit_id === unitId; });
          if (ex) { ex.factor = factor; if (barcode) ex.barcode = normBarcode(barcode); }
          else units.push({unit_id:unitId, factor:factor, barcode:normBarcode(barcode)});
        };
        put(base, 1, get(r, 'barcode'));
        if (get(r, 'unit2') && n(get(r, 'factor2')) > 0) put(uid(get(r, 'unit2')), n(get(r, 'factor2')), get(r, 'barcode2'));
        await q(sb.rpc('save_product', {p: {id: old ? old.id : null, sku: sku, name: get(r, 'name'), category_id: cid(get(r, 'cat')), base_unit_id: base,
          cost: n(get(r, 'cost')), price: n(get(r, 'price')), min_qty: n(get(r, 'min')), note: old ? old.note : '', active: old ? old.active : true, units: units}}));
        ok++;
      } catch(e){ errs.push(sku + ': ' + errMsg(e)); }
    }
    $('loading').textContent = 'กำลังทำงาน...';
    openModal('<h2>ผลการนำเข้า</h2><p>สำเร็จ ' + ok + ' รายการ' + (errs.length ? ', ไม่สำเร็จ ' + errs.length + ' รายการ' : '') + '</p>' +
      (errs.length ? '<div class="tbl-wrap"><table>' + errs.map(function(e){ return '<tr><td class="low">' + esc(e) + '</td></tr>'; }).join('') + '</table></div>' : '') +
      '<div class="row end"><button class="btn pri" onclick="closeModal()">ตกลง</button></div>');
    if ($('p-res')) loadProducts(0);
  });
  $('loading').textContent = 'กำลังทำงาน...';
}

async function loadDocs(pg){

var C = null;

PAGES.count = async function(){
  if (!isMgr()) return page('<p>เฉพาะผู้จัดการขึ้นไป</p>');
  var br = (C && C.branch) || S.cur;

  await loadUnits(C.rows.map(function(r){ return r.pid; }));

    '<div class="card"><div class="row"><label class="f">สาขา ' + branchSel('c-br', {value:C.branch}) + '</label>' +
    '<label class="f">หมวดหมู่ <select id="c-cat">' + catOptions('') + '</select></label><button class="btn" onclick="countLoadCat()">โหลดรายการสินค้า</button>' +
    '<label class="chk"><input type="checkbox" id="c-hide"' + (C.hide ? ' checked' : '') + '> ซ่อนยอดในระบบ (นับแบบไม่เห็นยอด)</label></div>' +

    '<button class="btn" onclick="openScanner(countCode)">สแกนด้วยกล้อง</button></div>' +
    '<p class="sub">ร่างการนับจะถูกเก็บไว้ในเครื่องนี้อัตโนมัติ ปิดหน้าแล้วกลับมานับต่อได้</p></div>' +
    '<div class="card"><div class="tbl-wrap"><table id="c-tbl"></table></div>' +
    '<div class="row end"><label class="chk" style="margin-right:auto"><input type="checkbox" id="c-zero"> รายการที่ไม่ได้กรอก ให้ถือว่านับได้ 0</label>' +
    '<button class="btn ghost" onclick="clearCount()">ล้างการนับ</button><button class="btn pri" onclick="submitCount()">บันทึกผลตรวจนับ</button></div></div>');
  $('c-br').onchange = function(){ saveCount(); C.branch = selNum('c-br'); C.rows = ls.get('count_draft_' + C.branch, []); loadUnits(C.rows.map(function(r){ return r.pid; })).then(countBal); };
  $('c-hide').onchange = function(){ C.hide = this.checked; renderCount(); };

  attachPicker('c-scan', addCountRow);

  });

};
async function countBal(){
  var pids = C.rows.map(function(r){ return r.pid; }); C.bal = {};
  for (var i = 0; i < pids.length; i += 200) {
    var rows = await q(sb.from('stock_balances').select('product_id,qty').eq('branch_id', C.branch).in('product_id', pids.slice(i, i + 200)));
    rows.forEach(function(r){ C.bal[r.product_id] = Number(r.qty); });
  }
  renderCount();
}
function rowTotal(r){ return (PU[r.pid] || []).reduce(function(s, u){ var v = r.counts[u.unit_id]; return s + (v === '' || v == null ? 0 : Number(v) * u.factor); }, 0); }
function touched(r){ return Object.keys(r.counts).some(function(k){ return r.counts[k] !== '' && r.counts[k] != null; }); }
function renderCount(){
  var html = '<tr><th>สินค้า</th>' + (C.hide ? '' : '<th class="num">ยอดในระบบ</th>') + '<th>จำนวนที่นับได้</th><th class="num">รวม (หน่วยฐาน)</th>' + (C.hide ? '' : '<th class="num">ผลต่าง</th>') + '<th></th></tr>';
  html += C.rows.length ? C.rows.map(function(r, i){
    return '<tr id="c-row-' + i + '"><td><b>' + esc(r.sku) + '</b><div class="sub">' + esc(r.name) + '</div></td>' +
      (C.hide ? '' : '<td class="num">' + qtyHtml(r.pid, C.bal[r.pid] || 0, r.base_unit_id) + '</td>') +
      '<td>' + (PU[r.pid] || []).map(function(u){ var v = r.counts[u.unit_id]; return '<label class="uc"><input type="number" min="0" step="any" data-i="' + i + '" data-u="' + u.unit_id + '" value="' + (v == null ? '' : esc(v)) + '">' + esc(u.name) + '</label>'; }).join('') + '</td>' +
      '<td class="num" id="c-tot-' + i + '"></td>' + (C.hide ? '' : '<td class="num" id="c-diff-' + i + '"></td>') +
      '<td><button class="x" onclick="C.rows.splice(' + i + ',1);saveCount();renderCount()">×</button></td></tr>';
  }).join('') : '<tr><td colspan="6" class="empty">สแกนสินค้าที่นับ หรือกด "โหลดรายการสินค้า" ตามหมวด</td></tr>';
  $h('c-tbl').innerHTML = html;
  C.rows.forEach(function(_, i){ countCells(i); });
}
function countCells(i){
  var r = C.rows[i], t = $('c-tot-' + i), d = $('c-diff-' + i); if (!t) return;
  var has = touched(r), tot = rowTotal(r), diff = tot - (C.bal[r.pid] || 0);
  t.innerHTML = has ? '<b>' + num(tot) + '</b> ' + esc(uname(r.base_unit_id)) : '<span class="sub">ยังไม่นับ</span>';
  if (d) d.innerHTML = has ? '<span class="' + (diff < 0 ? 'low' : diff > 0 ? 'okc' : '') + '">' + (diff > 0 ? '+' : '') + num(diff) + '</span>' : '';
}
async function addCountRow(p, unitId){
  await loadUnits([p.id]);
  var i = C.rows.findIndex(function(r){ return r.pid === p.id; });
  if (i < 0) {
    C.rows.unshift({pid:p.id, sku:p.sku, name:p.name, base_unit_id:p.base_unit_id, counts:{}}); i = 0;
    var b = await q(sb.from('stock_balances').select('qty').eq('branch_id', C.branch).eq('product_id', p.id).maybeSingle());
    C.bal[p.id] = b ? Number(b.qty) : 0;
  } else if (i > 0) { C.rows.unshift(C.rows.splice(i, 1)[0]); i = 0; }
  if (unitId) { var cur = C.rows[0].counts[unitId]; C.rows[0].counts[unitId] = Number(cur || 0) + 1; }
  beep(true); saveCount(); renderCount();
  var row = $('c-row-0'); if (row) { row.classList.add('flash'); if (!unitId) { var inp = row.querySelector('input'); if (inp) inp.focus(); } }
}
async function countCode(code){
  try { var r = await findByCode(code); if (r) addCountRow(r.p, r.unit_id); else { beep(false); toast('ไม่พบสินค้า: ' + code, 'bad'); } }
  catch(e){ toast(errMsg(e), 'bad'); }
}
async function countLoadCat(){
  var cat = selNum('c-cat');

    var list = await fetchAll(function(){ var qb = sb.from('products').select(PCOLS).eq('active', true).order('sku'); return cat ? qb.eq('category_id', cat) : qb; });
    if (!list.length) return toast('ไม่พบสินค้าในหมวดนี้', 'bad');
    if (list.length > 1500 && !confirm('มีสินค้า ' + list.length + ' รายการ อาจทำให้หน้าเว็บช้า แนะนำให้นับทีละหมวด ต้องการโหลดทั้งหมดหรือไม่?')) return;
    var have = {}; C.rows.forEach(function(r){ have[r.pid] = 1; });

function clearCount(){ if (C.rows.length && !confirm('ล้างข้อมูลการนับทั้งหมดของสาขานี้?')) return; C.rows = []; saveCount(); renderCount(); }
async function submitCount(){
  var rows = C.rows.filter(function(r){ return C.zero || touched(r); });
  if (!rows.length) return toast('ยังไม่ได้กรอกจำนวนที่นับ', 'bad');

  await busy(async function(){
    var doc = await q(sb.rpc('post_stock_count', {p_branch:C.branch, p_doc_date:today(), p_note:null,
      p_lines: rows.map(function(r){ return {product_id:r.pid, counted_base:rowTotal(r)}; })}));
    var done = {}; rows.forEach(function(r){ done[r.pid] = 1; });
    C.rows = C.rows.filter(function(r){ return !done[r.pid]; }); saveCount();
    toast('บันทึกผลตรวจนับแล้ว ' + doc.doc_no); await countBal(); showDoc(doc.id);
  });
}

    exportXlsx(rows.map(function(m){ var p = m.products || {}, d = m.stock_docs || {};
      return {'วันที่':m.move_date, 'เลขที่เอกสาร':d.doc_no, 'ประเภท':TYPE[d.doc_type] + (m.is_reversal ? ' (ยกเลิก)' : ''), 'สาขา':bname(m.branch_id),
        'รหัส':p.sku, 'ชื่อสินค้า':p.name, 'จำนวน':Number(m.qty), 'หน่วย':uname(m.unit_id), 'จำนวน (หน่วยฐาน)':Number(m.qty_base), 'หน่วยฐาน':uname(p.base_unit_id),
        'ทุน/หน่วย':m.unit_cost != null ? Number(m.unit_cost) : '', 'อ้างอิง':d.ref_no || '', 'หมายเหตุ':d.note || ''}; }),
      'เคลื่อนไหว', 'stock_moves_' + from + '_' + to + '.xlsx');
  });
}

// ============================================================
//  ตั้งค่า
// ============================================================
PAGES.settings = async function(){
  if (!isMgr()) return page('<p>เฉพาะผู้จัดการขึ้นไป</p>');
  await loadMaster();
  if (curPage !== 'settings') return;
  var html = '<div class="ph"><h1>ตั้งค่า</h1></div>';
  if (isAdmin()) {
    html += '<div class="card"><h3>สาขา</h3><div class="tbl-wrap"><table><tr><th>รหัส</th><th>ชื่อสาขา</th><th>สถานะ</th><th></th></tr>' +
      S.branches.map(function(b){ return '<tr><td><b>' + esc(b.code) + '</b></td><td>' + esc(b.name) + '</td><td>' + (b.active ? '<span class="okc">ใช้งาน</span>' : '<span class="sub">ปิด</span>') + '</td>' +
        '<td class="num"><button class="btn sm" onclick="editBranch(' + b.id + ')">แก้ชื่อ</button> <button class="btn sm" onclick="toggleBranch(' + b.id + ')">' + (b.active ? 'ปิดใช้งาน' : 'เปิดใช้งาน') + '</button></td></tr>'; }).join('') +
      '</table></div><div class="row" style="margin-top:12px"><label class="f">รหัสสาขา (ใช้ในเลขที่เอกสาร) <input id="nb-code" maxlength="10" placeholder="เช่น BKK"></label><label class="f grow">ชื่อสาขา <input id="nb-name"></label><button class="btn pri" onclick="addBranch()">เพิ่มสาขา</button></div></div>';
    html += '<div class="card"><h3>ผู้ใช้งาน</h3><div class="tbl-wrap" id="u-res"></div></div>';
  }
  html += '<div class="cols2"><div class="card"><h3>หน่วยนับ</h3><div class="chips">' + S.units.map(function(u){ return '<span class="chip">' + esc(u.name) + '<button class="x" title="แก้ชื่อ" onclick="renameMaster(\'units\',' + u.id + ')">✎</button></span>'; }).join('') + '</div>' +
    '<div class="row" style="margin-top:12px"><input id="nu-name" class="grow" placeholder="ชื่อหน่วยใหม่"><button class="btn pri" onclick="addMaster(\'units\',\'nu-name\')">เพิ่ม</button></div></div>' +
    '<div class="card"><h3>หมวดหมู่สินค้า</h3><div class="chips">' + (S.cats.length ? S.cats.map(function(c){ return '<span class="chip">' + esc(c.name) + '<button class="x" title="แก้ชื่อ" onclick="renameMaster(\'categories\',' + c.id + ')">✎</button><button class="x" title="ลบ" onclick="delCat(' + c.id + ')">×</button></span>'; }).join('') : '<span class="sub">ยังไม่มีหมวดหมู่</span>') + '</div>' +
    '<div class="row" style="margin-top:12px"><input id="nc-name" class="grow" placeholder="ชื่อหมวดหมู่ใหม่"><button class="btn pri" onclick="addMaster(\'categories\',\'nc-name\')">เพิ่ม</button></div></div></div>';
  if (!SUPABASE_URL) html += '<div class="card"><h3>การเชื่อมต่อ</h3><p class="sub">เชื่อมต่ออยู่กับค่าที่บันทึกในเบราว์เซอร์นี้</p><button class="btn" onclick="if(confirm(\'ล้างการตั้งค่าการเชื่อมต่อ?\')){ls.del(\'stock_cfg\');logout().then(function(){location.reload()})}">เปลี่ยนการเชื่อมต่อ</button></div>';
  page(html);
  if (isAdmin()) await loadUsers();
};
async function loadUsers(){
  var users = await q(sb.from('profiles').select('*').order('created_at'));
  var bo = function(v){ return '<option value="">— ทุกสาขา (เฉพาะผู้ดูแล) —</option>' + S.branches.map(function(b){ return '<option value="' + b.id + '"' + (b.id === v ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join(''); };
  $h('u-res').innerHTML = '<table><tr><th>ผู้ใช้</th><th>บทบาท</th><th>สาขา</th><th>อนุมัติ</th><th></th></tr>' + users.map(function(u){
    var self = u.id === me.id;
    return '<tr><td><b>' + esc(u.full_name || '-') + '</b><div class="sub">' + esc(u.email) + '</div></td>' +
      '<td><select id="ur-' + u.id + '"' + (self ? ' disabled' : '') + '>' + Object.keys(ROLE).map(function(k){ return '<option value="' + k + '"' + (u.role === k ? ' selected' : '') + '>' + ROLE[k] + '</option>'; }).join('') + '</select></td>' +
      '<td><select id="ub-' + u.id + '">' + bo(u.branch_id) + '</select></td>' +
      '<td><input type="checkbox" id="ua-' + u.id + '"' + (u.active ? ' checked' : '') + (self ? ' disabled' : '') + '>' + (u.active ? '' : ' <span class="b b-ADJUST">รออนุมัติ</span>') + '</td>' +
      '<td><button class="btn sm" onclick="saveUser(\'' + u.id + '\')">บันทึก</button></td></tr>';
  }).join('') + '</table>';
}
async function saveUser(id){
  var role = $('ur-' + id).value, br = $('ub-' + id).value ? Number($('ub-' + id).value) : null, act = $('ua-' + id).checked;
  if (role !== 'admin' && !br && act) return toast('ผู้จัดการและพนักงานต้องกำหนดสาขา', 'bad');
  await busy(async function(){
    await q(sb.from('profiles').update({role:role, branch_id:br, active:act}).eq('id', id));
    toast('บันทึกผู้ใช้แล้ว'); await loadUsers();
    if (id === me.id) { me.branch_id = br; buildNav(); }
  });
}
async function addBranch(){
  var code = $('nb-code').value.trim().toUpperCase(), name = $('nb-name').value.trim();
  if (!/^[A-Z0-9]{1,10}$/.test(code) || !name) return toast('รหัสสาขาใช้ A-Z, 0-9 และต้องกรอกชื่อสาขา', 'bad');
  await busy(async function(){ await q(sb.from('branches').insert({code:code, name:name})); toast('เพิ่มสาขาแล้ว'); await PAGES.settings(); });
}
async function editBranch(id){
  var b = S.branchMap[id], name = prompt('ชื่อสาขา', b.name); if (!name || !name.trim()) return;
  await busy(async function(){ await q(sb.from('branches').update({name:name.trim()}).eq('id', id)); await PAGES.settings(); });
}
async function toggleBranch(id){
  var b = S.branchMap[id];
  if (b.active && !confirm('ปิดใช้งานสาขา ' + b.name + '? (ข้อมูลเดิมยังอยู่)')) return;
  await busy(async function(){ await q(sb.from('branches').update({active:!b.active}).eq('id', id)); await PAGES.settings(); });
}
async function addMaster(table, inputId){
  var name = $(inputId).value.trim(); if (!name) return;
  await busy(async function(){ await q(sb.from(table).insert({name:name})); toast('เพิ่มแล้ว'); await PAGES.settings(); });
}
async function renameMaster(table, id){
  var cur = (table === 'units' ? S.unitMap : S.catMap)[id], name = prompt('แก้ชื่อ', cur.name); if (!name || !name.trim()) return;
  await busy(async function(){ await q(sb.from(table).update({name:name.trim()}).eq('id', id)); PU = {}; await PAGES.settings(); });
}
async function delCat(id){
  if (!confirm('ลบหมวดหมู่ ' + S.catMap[id].name + '?')) return;
  await busy(async function(){ await q(sb.from('categories').delete().eq('id', id)); toast('ลบแล้ว'); await PAGES.settings(); });
}

init();
</script>
</body>
